# Projektspezifische Einstellungen für die Dokumente in docs/de, ergänzend zu
# docs/_quarto.yml aus dem semantic-web-template (Quarto fügt sie zusammen).
# Modellierungsentscheide zeigen einen Ausschnitt des Datenmodells über dem
# Text; der Filter bindet für die Website auch entscheid.css ein.
filters:
  - path: assets/entscheid.lua
    at: pre-quarto
